<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Review Project</title>
</head>
<body>
    <main>
        <section class="container">
            <div class="title">
                <h2>Our Reviews</h2>
                <div class="underline"></div>
            </div>
            <article class="review">
                <div class="img-container">
                    <div class="img-fundo">
                        <img src="https://this-person-does-not-exist.com/img/avatar-genbbe012e68d277ddab74a95706d587f39.jpg" alt="" id="person-img">
                    </div>
                </div>
                <h4 id="author">Sara Jones</h4>
                <p id="job">Ux Designer</p>
                <p id="info">Lorem ipsum dolor sit amet consectetur adipisicing elit. Necessitatibus iure non quidem molestias ducimus tempore aperiam ipsam consequatur distinctio atque, eos odit nostrum debitis temporibus quibusdam illum id pariatur neque.</p>
                <div class="button-caontainer">
                    <button class="prev-btn">
                        <span class="material-symbols-outlined">chevron_backward</span>
                    </button>
                    <button class="next-btn">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
                <button class="random-btn">Surprise Me</button>
            </article>
        </section>
    </main>
</body>
</html>
